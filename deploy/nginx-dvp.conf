# DVP portal at https://vrc.mahindra.com/dvp/
#
# Paste these two blocks INSIDE the existing `server { ... server_name vrc.mahindra.com; ... }` block (the HTTPS one
# that already serves VRSP), above VRSP's `location / { ... }`. Then:  sudo nginx -t && sudo systemctl reload nginx
#
# The portal runs on 127.0.0.1:7100 (PM2 "dvp-portal"). Nginx strips /dvp: /dvp/api/... reaches the portal as /api/...

location = /dvp { return 301 /dvp/; }

location /dvp/ {
    proxy_pass http://127.0.0.1:7100/;              # the trailing slash strips /dvp
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Uploads: VR reports up to 200 MB by default (Settings → VR reports). Keep this a little above that setting.
    client_max_body_size 210m;
    proxy_request_buffering off;                    # stream big uploads straight to the portal
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
